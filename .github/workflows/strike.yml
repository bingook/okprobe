name: strike

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "health|enum|pin|harvest|admin|same_day|idor|full"
        required: true
        default: "full"
      size:
        description: "enum slice size (member numbers to scan)"
        required: false
        default: "5000"
      shards:
        description: "admin sharding total (parallel lanes)"
        required: false
        default: "1"
      shard:
        description: "admin shard index for this lane"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  strike:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: deps
        run: pip install -q requests || true
      - name: strike
        env:
          ADMIN_SHARDS: ${{ inputs.shards }}
          ADMIN_SHARD: ${{ inputs.shard }}
        run: python3 tick.py "${{ inputs.phase }}" "${{ inputs.size }}"
      - name: commit-state
        if: always()
        run: |
          git config user.email okprobe@bot
          git config user.name okprobe-bot
          git add -A
          git diff --cached --quiet || git commit -m "strike#${{ github.run_number }} ${{ inputs.phase }}"
          for i in 1 2 3; do
            git push 2>/dev/null && break
            git pull --no-rebase --no-edit || true
            if [ -f resolve_conflicts.py ]; then python3 resolve_conflicts.py || true; fi
            git add -A
            git diff --cached --quiet || git commit --no-edit -m "strike#${{ github.run_number }} merge" 2>/dev/null || git commit -m "strike#${{ github.run_number }} merge" || true
          done
          git push 2>/dev/null || git push --force-with-lease
